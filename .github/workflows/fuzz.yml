name: Fuzz

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly on Sunday at 4:37 UTC
    - cron: '37 4 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration per target (seconds)'
        required: false
        default: '300'
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer · ${{ matrix.target }}${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: fuzz_compile
            suffix: ""
          - os: ubuntu-24.04
            target: fuzz_differential
            suffix: ""
          # arm64 macOS is the backend this branch is actually about, and ASan
          # plus the arm64 codegen is a different enough combination that
          # fuzzing Linux alone leaves it unchecked.
          - os: macos-latest
            target: fuzz_compile
            suffix: " (macOS arm64)"
          - os: macos-latest
            target: fuzz_differential
            suffix: " (macOS arm64)"

    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        if: runner.os == 'Linux'
        run: |
          # ubuntu-24.04 runners ship clang; only fall back to apt when it is
          # missing, because the apt mirrors stall often enough to matter here.
          if command -v clang >/dev/null 2>&1; then
            echo "clang already installed: $(clang --version | head -1)"
          else
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
            sudo apt-get install -y -o Dpkg::Options::="--force-confdef" \
                 -o Dpkg::Options::="--force-confold" clang
          fi

      # Apple's clang ships no libFuzzer runtime: libclang_rt.fuzzer_osx.a is
      # absent from both the Command Line Tools and the Xcode toolchain, so
      # `-fsanitize=fuzzer` dies at link time.  Probe for one that works first
      # (a future image may ship it), then fall back to Homebrew's llvm, which
      # does.  The failure path is a hard error on purpose -- a fuzz leg that
      # never linked the fuzzer must not report green.
      - name: Select a libFuzzer-capable clang (macOS)
        if: runner.os == 'macOS'
        run: |
          set -x
          printf 'int main(void){return 0;}' > /tmp/fz_probe.c
          probe() { "$1" -fsanitize=fuzzer /tmp/fz_probe.c -o /tmp/fz_probe 2>/dev/null; }
          if probe clang; then
            echo "CLANG=clang" >> "$GITHUB_ENV"
            echo "system clang links libFuzzer"
            exit 0
          fi
          echo "system clang has no libFuzzer runtime; installing Homebrew llvm"
          brew install llvm
          llvm_prefix=$(brew --prefix llvm)
          probe "$llvm_prefix/bin/clang" || {
            echo "::error::no libFuzzer-capable clang available on this macOS image"
            exit 1
          }
          echo "CLANG=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"

      # CLANG is set by the macOS selection step above; on Linux it is unset and
      # build_fuzz.sh falls back to the system clang.
      - name: Build fuzz target
        run: CLANG="${CLANG:-clang}" bash fuzz/build_fuzz.sh

      - name: Run fuzz (${{ matrix.target }})
        timeout-minutes: 70
        run: |
          set -x
          cd build_fuzz

          # PR: quick smoke; push to master: 10 min; weekly: 60 min
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DURATION=60
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DURATION=${{ github.event.inputs.duration }}
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            DURATION=3600
          else
            DURATION=600
          fi
          echo "Fuzzing ${{ matrix.target }} for ${DURATION}s..."

          case "${{ matrix.target }}" in
            fuzz_compile)      CORPUS=corpus/compile; MAXLEN=4096 ;;
            fuzz_differential) CORPUS=corpus/differential; MAXLEN=2048 ;;
          esac

          # -rss_limit_mb=0: libFuzzer's default 2 GB cap is reached by ASan
          # plus the growing corpus long before fakecc does anything wrong.
          # GHA shell is bash -eo pipefail: without set +e, a non-zero
          # fuzzer exit (e.g. fakecc calling exit()) aborts before FUZZ_EXIT
          # / grep handling can treat "fuzz target exited" as non-fatal.
          set +e
          ASAN_OPTIONS=detect_leaks=0 \
          UBSAN_OPTIONS=print_stacktrace=1 \
          ./bin/${{ matrix.target }} \
            "$CORPUS" \
            -dict=../fuzz/c_keywords.dict \
            -max_len=${MAXLEN} \
            -max_total_time=${DURATION} \
            -error_exitcode=1 \
            -timeout_exitcode=70 \
            -rss_limit_mb=0 \
            -print_final_stats=1 \
            2>&1 | tee fuzz_${{ matrix.target }}.log
          FUZZ_EXIT=${PIPESTATUS[0]}
          set -e

          # 0 = budget exhausted, 1 = bug found, 70 = slow unit (non-fatal)
          if grep -q "ERROR: libFuzzer: fuzz target exited" "fuzz_${{ matrix.target }}.log"; then
            # fakecc reports allocation failure by calling exit(1), which kills
            # any process embedding it.  That is not something a fuzzer run can
            # act on, so record it and carry on.
            echo "::warning::${{ matrix.target }}: fakecc called exit() on an out-of-memory input (non-fatal)"
          elif [ ${FUZZ_EXIT} -eq 70 ]; then
            echo "::warning::${{ matrix.target }} hit a per-input timeout, treating as non-fatal"
          elif [ ${FUZZ_EXIT} -ne 0 ]; then
            echo "::error::${{ matrix.target }} found a bug (exit ${FUZZ_EXIT})!"
            exit 1
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # runner.os keeps the Linux and macOS legs from overwriting each
          # other's artifact -- both now fuzz the same two targets per run.
          name: crash-${{ matrix.target }}-${{ runner.os }}-${{ github.run_id }}
          path: |
            build_fuzz/crash-*
            build_fuzz/oom-*
            build_fuzz/timeout-*
            build_fuzz/fuzz_${{ matrix.target }}.log
          if-no-files-found: ignore

  # Windows x64 libFuzzer: same two targets as Linux/macOS.  ASan + fuzzer
  # runtimes live in CLANG64 compiler-rt; MINGW64 lacks ASan (see ci.yml).
  # The clang windows-gnu driver rejects -fsanitize=fuzzer, so build_fuzz.sh
  # falls back to sanitize-coverage + an explicit fuzzer archive link.
  fuzz-windows:
    name: libFuzzer · ${{ matrix.target }} (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_compile, fuzz_differential]

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 CLANG64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          pacboy: clang:p compiler-rt:p cmake:p ninja:p
          # Real MinGW gcc for fuzz_differential's oracle (not clang64 gcc-compat).
          install: mingw-w64-x86_64-gcc

      - name: Build fuzz target
        run: |
          # CLANG64 PATH omits /mingw64/bin; differential needs real MinGW gcc.
          export PATH="$PATH:/mingw64/bin"
          CLANG=clang bash fuzz/build_fuzz.sh

      - name: Run fuzz (${{ matrix.target }})
        timeout-minutes: 70
        run: |
          set -x
          export PATH="$PATH:/mingw64/bin"
          cd build_fuzz

          # PR: quick smoke; push to master: 10 min; weekly: 60 min
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DURATION=60
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DURATION=${{ github.event.inputs.duration }}
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            DURATION=3600
          else
            DURATION=600
          fi
          echo "Fuzzing ${{ matrix.target }} for ${DURATION}s..."

          case "${{ matrix.target }}" in
            fuzz_compile)      CORPUS=corpus/compile; MAXLEN=4096 ;;
            fuzz_differential) CORPUS=corpus/differential; MAXLEN=2048 ;;
          esac

          FUZZ_BIN=./bin/${{ matrix.target }}
          if [ ! -x "$FUZZ_BIN" ] && [ -x "${FUZZ_BIN}.exe" ]; then
            FUZZ_BIN="${FUZZ_BIN}.exe"
          fi

          # Native Windows PE cannot write /tmp; prefer TEMP/TMP when TMPDIR unset.
          export TMPDIR="${TMPDIR:-${TEMP:-${TMP:-.}}}"

          # -rss_limit_mb=0: libFuzzer's default 2 GB cap is reached by ASan
          # plus the growing corpus long before fakecc does anything wrong.
          # GHA shell is bash -eo pipefail: without set +e, a non-zero
          # fuzzer exit (e.g. fakecc calling exit()) aborts before FUZZ_EXIT
          # / grep handling can treat "fuzz target exited" as non-fatal.
          set +e
          ASAN_OPTIONS=detect_leaks=0 \
          UBSAN_OPTIONS=print_stacktrace=1 \
          "$FUZZ_BIN" \
            "$CORPUS" \
            -dict=../fuzz/c_keywords.dict \
            -max_len=${MAXLEN} \
            -max_total_time=${DURATION} \
            -error_exitcode=1 \
            -timeout_exitcode=70 \
            -rss_limit_mb=0 \
            -print_final_stats=1 \
            2>&1 | tee fuzz_${{ matrix.target }}.log
          FUZZ_EXIT=${PIPESTATUS[0]}
          set -e

          # 0 = budget exhausted, 1 = bug found, 70 = slow unit (non-fatal)
          if grep -q "ERROR: libFuzzer: fuzz target exited" "fuzz_${{ matrix.target }}.log"; then
            echo "::warning::${{ matrix.target }}: fakecc called exit() on an out-of-memory input (non-fatal)"
          elif [ ${FUZZ_EXIT} -eq 70 ]; then
            echo "::warning::${{ matrix.target }} hit a per-input timeout, treating as non-fatal"
          elif [ ${FUZZ_EXIT} -ne 0 ]; then
            echo "::error::${{ matrix.target }} found a bug (exit ${FUZZ_EXIT})!"
            exit 1
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Explicit Windows in the name so it cannot collide with Linux/macOS.
          name: crash-${{ matrix.target }}-Windows-${{ github.run_id }}
          path: |
            build_fuzz/crash-*
            build_fuzz/oom-*
            build_fuzz/timeout-*
            build_fuzz/fuzz_${{ matrix.target }}.log
          if-no-files-found: ignore
