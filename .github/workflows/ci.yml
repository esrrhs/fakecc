name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: ${{ matrix.config.label }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # An unoptimized build exercises almost none of the optimizer, and the
        # compiler's own sources turned out to be sensitive to it: a by-value
        # struct parameter that clang -O1 mutated in place silently broke every
        # array.  Build each compiler at -O2 as well so that class of bug fails
        # here instead of in whatever release build hits it first.
        config:
          - label: ubuntu-latest · gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cflags: ""
          - label: ubuntu-latest · gcc -O2
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cflags: "-O2"
          - label: ubuntu-24.04 · clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cflags: ""
          - label: ubuntu-24.04 · clang -O2
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cflags: "-O2"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_FLAGS="${{ matrix.config.cflags }}"
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  bootstrap:
    name: bootstrap (stage 2 fixed point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build stage 0
        run: |
          cmake -S . -B build
          cmake --build build --parallel

      # Stage 0 compiles and links fakecc; that fakecc compiles and links
      # fakecc again.  Both stages must produce byte-identical objects and
      # binaries, which fails loudly on any miscompilation that is not an
      # exact fixed point.
      - name: Stage 2 fixed point
        run: bash v0/stage2_check.sh

      # A fixed point alone does not prove correctness — a deterministic but
      # wrong compiler also reproduces itself.  Run the suite with the
      # self-hosted binary too.
      - name: e2e with the self-hosted compiler
        run: bash test/e2e/run_e2e.sh v0/fakecc-1
