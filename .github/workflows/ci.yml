name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: ${{ matrix.config.label }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # An unoptimized build exercises almost none of the optimizer, and the
        # compiler's own sources turned out to be sensitive to it: a by-value
        # struct parameter that clang -O1 mutated in place silently broke every
        # array.  Build each compiler at -O2 as well so that class of bug fails
        # here instead of in whatever release build hits it first.
        config:
          - label: ubuntu-latest · gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cflags: ""
          - label: ubuntu-latest · gcc -O2
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cflags: "-O2"
          - label: ubuntu-latest · gcc ASan
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cflags: "-fsanitize=address,undefined -g"
          - label: ubuntu-24.04 · clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cflags: ""
          - label: ubuntu-24.04 · clang -O2
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cflags: "-O2"

    steps:
      - uses: actions/checkout@v4

      # difftest hardcodes host `gcc` as the oracle.  Runner images ship GCC
      # 13.2, which still has tree-optimization/123864; install GCC 16 so the
      # oracle matches the expected result (also used when matrix.cc is gcc).
      - name: Install host GCC 16
        run: bash tools/ci_install_host_gcc.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_FLAGS="${{ matrix.config.cflags }}"
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Wall-clock of this job is dominated by self-hosted e2e (~28 min) and
  # difftest (~30 min), each run twice (-O0 then -O1) on one runner.  Each
  # suite already saturates nproc, so overlapping them on the same VM does
  # not help; splitting across runners does.  Recent master: ~62 min serial
  # vs ~stage2 + max(one suite) ≈ 18 min after the split.
  bootstrap:
    name: bootstrap (fixed point)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install host GCC 16
        run: bash tools/ci_install_host_gcc.sh

      # -O2 only speeds Stage 0 (gcc-built fakecc compiling v0/*.c).  It does
      # not change fakecc-1's codegen, so the fixed-point comparison is the
      # same as an unoptimized Stage 0.
      - name: Build stage 0
        run: |
          cmake -S . -B build -DCMAKE_C_FLAGS="-O2"
          cmake --build build --parallel

      # Stage 0 compiles and links fakecc; that fakecc compiles and links
      # fakecc again.  Both stages must produce byte-identical binaries,
      # which fails loudly on any miscompilation that is not an exact
      # fixed point.
      - name: Stage 2 fixed point
        run: bash v0/stage2_check.sh

      - name: Upload self-hosted compiler
        uses: actions/upload-artifact@v4
        with:
          name: fakecc-1
          path: v0/fakecc-1
          if-no-files-found: error
          retention-days: 1

  # A fixed point alone does not prove correctness — a deterministic but
  # wrong compiler also reproduces itself.  Re-run the functional suites
  # with the self-hosted binary.  -O0 and -O1 differ in whether scalars are
  # promoted out of memory, so they stay separate matrix legs.
  bootstrap-suite:
    name: bootstrap · ${{ matrix.label }}
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: e2e -O0
            suite: e2e
            opt: -O0
          - label: e2e -O1
            suite: e2e
            opt: -O1
          - label: difftest -O0
            suite: difftest
            opt: -O0
          - label: difftest -O1
            suite: difftest
            opt: -O1
          - label: multi/shlib/gdb
            suite: misc
            opt: ""
    steps:
      - uses: actions/checkout@v4

      # Needed for the difftest matrix legs (host gcc is the oracle).
      - name: Install host GCC 16
        run: bash tools/ci_install_host_gcc.sh

      - name: Download self-hosted compiler
        uses: actions/download-artifact@v4
        with:
          name: fakecc-1
          path: v0

      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
          OPT: ${{ matrix.opt }}
        run: |
          chmod +x v0/fakecc-1
          case "$SUITE" in
            e2e)
              CC_TIMEOUT=300 bash test/e2e/run_e2e.sh v0/fakecc-1 "$OPT"
              ;;
            difftest)
              bash test/e2e/run_difftest.sh v0/fakecc-1 "$OPT"
              ;;
            misc)
              bash test/e2e/run_multi_e2e.sh v0/fakecc-1 -O0
              bash test/e2e/run_multi_e2e.sh v0/fakecc-1 -O1
              bash test/e2e/run_shlib_e2e.sh v0/fakecc-1 -O0
              bash test/e2e/run_shlib_e2e.sh v0/fakecc-1 -O1
              bash test/e2e/run_gdb_e2e.sh v0/fakecc-1
              ;;
            *)
              echo "unknown suite: $SUITE" >&2
              exit 2
              ;;
          esac
